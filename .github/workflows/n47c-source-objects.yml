name: N47C fixed source-object transfer
on:
  push:
    branches: ['delivery/n47c-source-objects']
    paths: ['.github/workflows/n47c-source-objects.yml']
permissions:
  contents: read
jobs:
  source-objects:
    if: github.repository == 'youq616/qbrain' && github.ref == 'refs/heads/delivery/n47c-source-objects'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6420d9d013e43a81922b01a1db641ceade196631
          path: candidate
          persist-credentials: false
      - name: Verify fixed patch and upload immutable file objects
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          import base64, hashlib, json, lzma, os, re, subprocess
          from pathlib import Path
          repo='youq616/qbrain'
          base='6420d9d013e43a81922b01a1db641ceade196631'
          base_tree='b1cf5f79da5852f8f5f1aa7651b5618c951f488c'
          candidate=Path('candidate').resolve()
          root=Path(os.environ['RUNNER_TEMP'])/'n47c-fixed-source'
          root.mkdir(exist_ok=False)
          def git(*args):
              return subprocess.check_output(['git','-C',str(candidate),*args],stderr=subprocess.PIPE,timeout=30).decode().strip()
          encoded=''.join(Path(f'transport/transfer/n47c.{n}').read_text(encoding='ascii').strip() for n in range(5))
          assert len(encoded)==27680
          packed=base64.b64decode(encoded,validate=True)
          assert len(packed)==20760 and hashlib.sha256(packed).hexdigest()=='57c30b35ec2f480300a5f3bff958130d940b5c58a97980e4e4188c67e763e2c5'
          decoder=lzma.LZMADecompressor(memlimit=256*1024*1024)
          raw=decoder.decompress(packed,max_length=512*1024)
          assert decoder.eof and not decoder.unused_data and len(raw)==79697
          document=json.loads(raw.decode('utf-8'))
          assert document['base']==base and git('rev-parse','HEAD')==base and git('rev-parse','HEAD^{tree}')==base_tree
          expected={'include/qbrain/memory/fact_store.hpp','src/qbrain/memory/fact_store.cpp','src/qbrain/ops/memory_ops.cpp','src/qbrain/cli/commands.cpp','CMakeLists.txt','scripts/build-tests-cl.ps1','tests/test_main.cpp','tests/test_n47c.cpp','.ci/test_recall_process.py','.ci/test_recall_unit.py','.ci/validate_recall_report.py','.ci/test_recall_report.py','.ci/test_validate_native_log.py','.ci/package_n44_development.py','.github/workflows/n44-validation.yml','.github/workflows/n42-validation.yml','docs/integration/FACT-RECALL.zh-CN.md'}
          entries=document['files']
          assert len(entries)==17 and {x['path'] for x in entries}==expected
          for entry in entries:
              path=entry['path']
              assert re.fullmatch('[0-9a-f]{40}',entry['sha'])
              if entry['old_sha'] is None:
                  result=subprocess.run(['git','-C',str(candidate),'cat-file','-e','HEAD:'+path],stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=30)
                  assert result.returncode!=0
              else:
                  assert git('rev-parse','HEAD:'+path)==entry['old_sha']
          patch=root/'change.patch';patch.write_text(document['patch'],encoding='utf-8',newline='')
          subprocess.run(['git','-C',str(candidate),'apply','--unidiff-zero','--index',str(patch)],check=True,timeout=30)
          assert set(git('diff','--cached','--name-only').splitlines())==expected
          result_entries=[]
          for entry in entries:
              path=entry['path'];data=(candidate/path).read_bytes()
              digest=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert digest==entry['sha'] and git('rev-parse',':'+path)==digest
              request=root/'request.json'
              request.write_text(json.dumps({'content':data.decode('utf-8'),'encoding':'utf-8'}),encoding='utf-8')
              response=json.loads(subprocess.check_output(['gh','api','--method','POST',f'repos/{repo}/git/blobs','--input',str(request)],stderr=subprocess.PIPE,timeout=60))
              assert response['sha']==digest
              result_entries.append({'path':path,'mode':'100644','type':'blob','sha':digest})
          result={'result':'SOURCE_OBJECTS_UPLOADED','base_commit':base,'base_tree':base_tree,'candidate_tree':git('write-tree'),'files':result_entries,'product_commit_created':False,'product_branch_updated':False,'windows_tests_run_here':False,'patch_sha256':hashlib.sha256(patch.read_bytes()).hexdigest()}
          evidence=Path('evidence');evidence.mkdir()
          (evidence/'source-objects.json').write_text(json.dumps(result,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: n47c-source-objects
          path: evidence/source-objects.json
          retention-days: 14
