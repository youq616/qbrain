name: N47P installer recovery validation
on:
  push:
    branches: ['optimization/n47p-installer-recovery', main]
    paths: ['scripts/Install-QbrainMemory.ps1', '.ci/test_installer_recovery.ps1', '.ci/check_recovery_report.py', '.ci/test_installer_snapshot.ps1', '.ci/check_installer_snapshot_report.py', '.ci/test_check_installer_snapshot_report.py', '.github/workflows/n47p-validation.yml']
  pull_request:
    paths: ['scripts/Install-QbrainMemory.ps1', '.ci/test_installer_recovery.ps1', '.ci/check_recovery_report.py', '.ci/test_installer_snapshot.ps1', '.ci/check_installer_snapshot_report.py', '.ci/test_check_installer_snapshot_report.py', '.github/workflows/n47p-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: n47p-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONIOENCODING: utf-8
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Archive exact reviewed inputs
        shell: bash
        run: |
          git archive --format=zip --output=qbrain-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qbrain-n47p-source
          path: qbrain-source.zip
          retention-days: 14
          if-no-files-found: error
  recovery:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3ebecf26946ae6ddd04fb018085ffc023b5fcab0
          path: prior
          persist-credentials: false
      - name: Obtain the fixed previously released executable and baseline installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force evidence | Out-Null
          git rev-parse HEAD | Set-Content evidence/source.txt
          Invoke-WebRequest 'https://github.com/youq616/qbrain/releases/download/windows-preview-c26ec5e5/qbrain-windows-x64-reviewed.zip' -OutFile baseline.zip
          if ((Get-FileHash baseline.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'ec681a4599bf1b2a90f3848f5bf65b6d6a32e37254f32392d0709c43080b356c') { throw 'Package identity mismatch' }
          Expand-Archive baseline.zip baseline
          if ((Get-FileHash baseline/qbrain.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'c35fadde8c8356b7243bf0b34cfd5c836bda27bb46da87eddcc79c1031bf05b5') { throw 'EXE identity mismatch' }
          if ((Get-FileHash baseline/scripts/Install-QbrainMemory.ps1 -Algorithm SHA256).Hash.ToLowerInvariant() -ne '99d864bf1e87c75a2b7c22a7f2c27d3b25210a153ef10516e9fff366313a22a6') { throw 'Baseline installer identity mismatch' }
      - name: Snapshot consistency and exact-prior counterexample
        shell: pwsh
        env:
          TEST_SHELL: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'
          $major = if ($env:TEST_SHELL -eq 'powershell') { 5 } else { 7 }
          & $env:TEST_SHELL -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .ci/test_installer_snapshot.ps1 -Binary baseline/qbrain.exe -Report evidence/snapshot.json 2>&1 | Tee-Object evidence/snapshot.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .ci/check_installer_snapshot_report.py --report evidence/snapshot.json --installer scripts/Install-QbrainMemory.ps1 --test .ci/test_installer_snapshot.ps1 --binary baseline/qbrain.exe --source $env:GITHUB_SHA --shell $major 2>&1 | Tee-Object evidence/snapshot-check.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:TEST_SHELL -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .ci/test_installer_snapshot.ps1 -Installer prior/scripts/Install-QbrainMemory.ps1 -Binary baseline/qbrain.exe -Report evidence/snapshot-prior.json 2>&1 | Tee-Object evidence/snapshot-prior.log
          if ($LASTEXITCODE -ne 1) { throw 'Expected prior snapshot regression exit 1' }
          python .ci/check_installer_snapshot_report.py --report evidence/snapshot-prior.json --installer prior/scripts/Install-QbrainMemory.ps1 --test .ci/test_installer_snapshot.ps1 --binary baseline/qbrain.exe --source $env:GITHUB_SHA --shell $major --baseline 2>&1 | Tee-Object evidence/snapshot-prior-check.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .ci/test_check_installer_snapshot_report.py 2>&1 | Tee-Object evidence/snapshot-check-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -O .ci/test_check_installer_snapshot_report.py 2>&1 | Tee-Object evidence/snapshot-check-tests-optimized.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fixed installer recovery and original regressions
        shell: pwsh
        env:
          TEST_SHELL: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:TEST_SHELL -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .ci/test_installer_recovery.ps1 -Binary baseline/qbrain.exe -Report evidence/recovery.json 2>&1 | Tee-Object evidence/recovery.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .ci/check_recovery_report.py --report evidence/recovery.json --installer scripts/Install-QbrainMemory.ps1 --binary baseline/qbrain.exe 2>&1 | Tee-Object evidence/report-check.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($test in @('test_install_hooks','test_install_consent','test_windows_transport')) {
            & $env:TEST_SHELL -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".ci/$test.ps1" -Binary baseline/qbrain.exe 2>&1 | Tee-Object "evidence/$test.log"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          foreach ($test in @('test_hook_fact_install','test_promotion_install')) {
            & $env:TEST_SHELL -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".ci/$test.ps1" -Binary baseline/qbrain.exe -Report "evidence/$test.json" 2>&1 | Tee-Object "evidence/$test.log"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Same regression suite must expose the old installer defects
        shell: pwsh
        env:
          TEST_SHELL: ${{ matrix.shell }}
        run: |
          & $env:TEST_SHELL -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .ci/test_installer_recovery.ps1 -Installer baseline/scripts/Install-QbrainMemory.ps1 -Binary baseline/qbrain.exe -Report evidence/baseline.json 2>&1 | Tee-Object evidence/baseline.log
          if ($LASTEXITCODE -ne 1) { throw 'Expected baseline regression exit 1' }
          python .ci/check_recovery_report.py --report evidence/baseline.json --installer baseline/scripts/Install-QbrainMemory.ps1 --binary baseline/qbrain.exe --baseline 2>&1 | Tee-Object evidence/baseline-check.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qbrain-n47p-${{ matrix.shell }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
  full-native:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fresh native application and unchanged full original unit suite
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          git rev-parse HEAD | Set-Content evidence/source.txt
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-tests-cl.ps1 2>&1 | Tee-Object evidence/native.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import sys,pathlib;sys.path.insert(0,'.ci');from validate_native_log import verified_groups;print(len(verified_groups(pathlib.Path('tests/test_main.cpp').read_text(),pathlib.Path('evidence/native.log').read_text(encoding='utf-8-sig'),60)))" 2>&1 | Tee-Object evidence/native-groups.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qbrain-n47p-full-native
          path: evidence/
          retention-days: 14
          if-no-files-found: error
