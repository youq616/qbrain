name: N48E pinned account-free OpenCode compatibility
on:
  push:
    branches: ['integration/n48e-opencode-lifecycle']
    paths: ['.ci/n48e_host_review.py', '.github/workflows/n48e-host-review.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: n48e-host-${{ github.ref }}
  cancel-in-progress: false
jobs:
  host:
    if: github.repository == 'youq616/qbrain' && github.ref == 'refs/heads/integration/n48e-opencode-lifecycle'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Record source and test status parsing
        shell: bash
        run: |
          set -euo pipefail
          mkdir evidence
          git rev-parse HEAD > evidence/source.txt
          git archive --format=zip --output=evidence/source.zip HEAD
          python .ci/n48e_host_review.py --offline-tests 2>&1 | tee evidence/offline.log
          python -O .ci/n48e_host_review.py --offline-tests 2>&1 | tee evidence/offline-optimized.log
      - name: Download only fixed candidate and official host bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python .ci/n48e_host_review.py --fetch host-inputs 2>&1 | tee evidence/download.log
          cp host-inputs/pins.json evidence/pins.json
      - name: Real host configuration and connection without model prompts
        shell: bash
        run: |
          set -euo pipefail
          python .ci/n48e_host_review.py --inputs host-inputs --output evidence/host 2>&1 | tee evidence/host.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qbrain-n48e-host-${{ matrix.os }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
