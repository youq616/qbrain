name: Recover N44 draft for inspection
on:
  push:
    branches: ['optimization/n44-context-release']
    paths: ['.github/workflows/n44-recover-draft.yml']
permissions:
  contents: read
jobs:
  recover:
    if: github.repository == 'youq616/qbrain'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Recover bytes for inspection; partial content is not a validated patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          out = pathlib.Path('recovered')
          out.mkdir()
          parts = []
          shas = ['53cbeaf6966021bca74bed12634007a3043c6d02','f8670ec3335b188a7428b635c06b6a46c453a92b','0eac260cdc4805632f18540d956dca89ce4b9d8e']
          for sha in shas:
              request = urllib.request.Request('https://api.github.com/repos/youq616/qbrain/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  blob = json.load(response)
              data = base64.b64decode(blob['content'])
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              parts.append(data.decode('ascii').strip())
          compressed = base64.b64decode(''.join(parts), validate=True)
          decoder = lzma.LZMADecompressor(memlimit=268435456)
          raw = decoder.decompress(compressed, max_length=4194304)
          (out / 'draft.partial.txt').write_bytes(raw)
          status = {'complete': decoder.eof and not decoder.unused_data, 'length':len(raw), 'sha256':hashlib.sha256(raw).hexdigest(), 'compressed_sha256':hashlib.sha256(compressed).hexdigest()}
          (out / 'status.json').write_text(json.dumps(status, indent=2))
          print(status)
          print('Prefix:',repr(raw[:160]), 'Suffix:',repr(raw[-160:]))
          subprocess.run(['git','archive','--format=zip','--output=recovered/base-source.zip','HEAD'], check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qbrain-n44-recovered-draft
          path: recovered/
          retention-days: 14
