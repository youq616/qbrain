name: Apply locally verified N43 source once
on:
  push:
    branches: ['optimization/n43-memory-cycle']
    paths: ['.ci/n43-import/**', '.ci/apply_n43_once.py', '.github/workflows/apply-n43-once.yml']
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'youq616/qbrain' && github.ref == 'refs/heads/optimization/n43-memory-cycle'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Verify and apply source without changing workflow files through CI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.ci/apply_n43_once.py')
          s = p.read_text()
          old = "BASE = '258698aba8f3f53f4243d09fc19cb084a3ec2d3a'"
          assert s.count(old) == 1
          s = s.replace(old, "BASE = 'bc804f2fdca62f7711f2ec1427b80b6d20ffdbce'")
          old = "(ROOT / '.github/workflows/apply-n43-once.yml').unlink()"
          assert s.count(old) == 1
          s = s.replace(old, "(ROOT / '.github/workflows/n43-validation.yml').unlink()")
          s = s.replace('Applied and verified 28 source files; temporary importer removed; commit', 'Verified 28 files; committed 27 source files; owner connector must install daily workflow and remove importer workflow; commit')
          p.write_text(s)
          PY
          python3 .ci/apply_n43_once.py
