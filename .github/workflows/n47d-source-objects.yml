name: N47D fixed source-object transfer
on:
  push:
    branches: ['delivery/n47d-source-objects']
    paths: ['.github/workflows/n47d-source-objects.yml']
permissions:
  contents: read
jobs:
  source-objects:
    if: github.repository == 'youq616/qbrain' && github.ref == 'refs/heads/delivery/n47d-source-objects'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5cc8e8b28c77cbeee5671924466b809113dc2ef0
          path: candidate
          persist-credentials: false
      - name: Verify fixed source bytes and upload Git blobs only
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          import base64, hashlib, json, lzma, os, re, subprocess
          from pathlib import Path
          repo='youq616/qbrain';base='5cc8e8b28c77cbeee5671924466b809113dc2ef0'
          base_tree='0faa11de3f494843fc1f6653ac706585c16cba94'
          candidate=Path('candidate').resolve()
          root=Path(os.environ['RUNNER_TEMP'])/'n47d-fixed-source';root.mkdir(exist_ok=False)
          def git(*args):
              return subprocess.check_output(['git','-C',str(candidate),*args],stderr=subprocess.PIPE,timeout=30).decode().strip()
          parts=[Path(f'transport/transfer/n47d.{n}').read_text(encoding='ascii').strip() for n in range(3)]
          # The submitted text contains one diagnosed four-character duplication.
          # This is transport correction, never a replacement for the external hash.
          if len(parts[1])==12004:
              assert parts[1].count('9jqziztviztvCcg')==1
              parts[1]=parts[1].replace('9jqziztviztvCcg','9jqziztvCcg')
          assert [len(p) for p in parts]==[12000,12000,5880]
          encoded=''.join(parts);assert len(encoded)==29880
          packed=base64.b64decode(encoded,validate=True)
          assert len(packed)==22408 and hashlib.sha256(packed).hexdigest()=='c588dc24cfb60c4057b8c064f8f547855d40336fde6c95ce875c8592228992f9'
          decoder=lzma.LZMADecompressor(memlimit=256*1024*1024)
          raw=decoder.decompress(packed,max_length=512*1024)
          assert decoder.eof and not decoder.unused_data and len(raw)==92367
          document=json.loads(raw.decode('utf-8'))
          assert document['base']==base and git('rev-parse','HEAD')==base and git('rev-parse','HEAD^{tree}')==base_tree
          expected={'.ci/package_n44_development.py','.ci/test_hook_fact_install.ps1','.ci/test_hook_fact_process.py','.ci/test_hook_fact_report.py','.ci/test_hook_fact_unit.py','.ci/test_validate_native_log.py','.ci/validate_hook_fact_report.py','.github/workflows/n42-validation.yml','.github/workflows/n44-validation.yml','CMakeLists.txt','docs/integration/HOOK-FACT-RECALL.zh-CN.md','include/qbrain/integration/detail/fact_context.hpp','include/qbrain/memory/fact_store.hpp','scripts/Install-QbrainMemory.ps1','scripts/build-tests-cl.ps1','src/qbrain/integration/hook.cpp','src/qbrain/memory/fact_store.cpp','tests/test_main.cpp','tests/test_n47d.cpp'}
          entries=document['files'];assert len(entries)==19 and {x['path'] for x in entries}==expected
          for entry in entries:
              path=entry['path'];assert re.fullmatch('[0-9a-f]{40}',entry['sha'])
              if entry['old_sha'] is None:
                  assert subprocess.run(['git','-C',str(candidate),'cat-file','-e','HEAD:'+path],stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=30).returncode!=0
              else:
                  assert git('rev-parse','HEAD:'+path)==entry['old_sha']
          patch=root/'change.patch';patch.write_text(document['patch'],encoding='utf-8',newline='')
          subprocess.run(['git','-C',str(candidate),'apply','--unidiff-zero','--index',str(patch)],check=True,timeout=30)
          assert set(git('diff','--cached','--name-only').splitlines())==expected
          result_entries=[]
          for entry in entries:
              path=entry['path'];data=(candidate/path).read_bytes()
              digest=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert digest==entry['sha'] and git('rev-parse',':'+path)==digest
              request=root/'request.json';request.write_text(json.dumps({'content':data.decode('utf-8'),'encoding':'utf-8'}),encoding='utf-8')
              response=json.loads(subprocess.check_output(['gh','api','--method','POST',f'repos/{repo}/git/blobs','--input',str(request)],stderr=subprocess.PIPE,timeout=60))
              assert response['sha']==digest
              result_entries.append({'path':path,'mode':'100644','type':'blob','sha':digest})
          result={'result':'SOURCE_OBJECTS_UPLOADED','base_commit':base,'base_tree':base_tree,'candidate_tree':git('write-tree'),'files':result_entries,'product_commit_created':False,'product_branch_updated':False,'windows_tests_run_here':False,'patch_sha256':hashlib.sha256(patch.read_bytes()).hexdigest()}
          evidence=Path('evidence');evidence.mkdir()
          (evidence/'source-objects.json').write_text(json.dumps(result,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: n47d-source-objects
          path: evidence/source-objects.json
          retention-days: 14
