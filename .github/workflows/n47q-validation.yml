name: N47Q cross-session task evaluation
on:
  push:
    branches: [main, 'evaluation/n47q-cross-session-tasks']
    paths: ['tools/acceptance/*memory_task*.py', '.github/workflows/n47q-validation.yml']
  pull_request:
    paths: ['tools/acceptance/*memory_task*.py', '.github/workflows/n47q-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: n47q-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pin the native runtime; do not install a real client
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force evidence | Out-Null
          git rev-parse HEAD | Set-Content evidence/source.txt
          Invoke-WebRequest 'https://github.com/youq616/qbrain/releases/download/windows-preview-c26ec5e5/qbrain-windows-x64-reviewed.zip' -OutFile runtime.zip
          if ((Get-FileHash runtime.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'ec681a4599bf1b2a90f3848f5bf65b6d6a32e37254f32392d0709c43080b356c') { throw 'Wrong runtime package' }
          Expand-Archive runtime.zip runtime
          if ((Get-FileHash runtime/qbrain.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'c35fadde8c8356b7243bf0b34cfd5c836bda27bb46da87eddcc79c1031bf05b5') { throw 'Wrong runtime EXE' }
      - name: Strict scoring tests and two event-format task runs
        shell: pwsh
        run: |
          python tools/acceptance/test_memory_tasks.py 2>&1 | Tee-Object evidence/unit.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -O tools/acceptance/test_memory_tasks.py 2>&1 | Tee-Object evidence/unit-optimized.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($hostFormat in @('claude', 'codex')) {
            python tools/acceptance/run_memory_tasks.py --binary runtime/qbrain.exe --host $hostFormat --output "evidence/$hostFormat" 2>&1 | Tee-Object "evidence/$hostFormat.log"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python tools/acceptance/check_memory_task_run.py --directory "evidence/$hostFormat" --binary runtime/qbrain.exe --report "evidence/readback-$hostFormat.json" 2>&1 | Tee-Object "evidence/readback-$hostFormat.log"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qbrain-n47q-windows-evidence
          path: evidence/
          retention-days: 14
          if-no-files-found: error
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fresh engine build and unchanged focused unit suites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source.txt
          git archive --format=zip --output=evidence/qbrain-source.zip HEAD
          cmake -S . -B build/n47q -DCMAKE_BUILD_TYPE=Release -DQBRAIN_WITH_PG=OFF 2>&1 | tee evidence/configure.log
          cmake --build build/n47q --target qbrain qbrain_memory_tests qbrain_context_tests qbrain_fact_tests qbrain_multiterm_tests --parallel 2 2>&1 | tee evidence/build.log
          ctest --test-dir build/n47q -R 'qbrain_(memory|context|fact|multiterm)_unit' --output-on-failure 2>&1 | tee evidence/core-unit.log
      - name: Tool tests, actual processes and file readback
        shell: bash
        run: |
          set -euo pipefail
          python tools/acceptance/test_memory_tasks.py 2>&1 | tee evidence/unit.log
          python -O tools/acceptance/test_memory_tasks.py 2>&1 | tee evidence/unit-optimized.log
          for host in claude codex; do
            python tools/acceptance/run_memory_tasks.py --binary build/n47q/qbrain --host "$host" --output "evidence/$host" 2>&1 | tee "evidence/$host.log"
            python tools/acceptance/check_memory_task_run.py --directory "evidence/$host" --binary build/n47q/qbrain --report "evidence/readback-$host.json" 2>&1 | tee "evidence/readback-$host.log"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qbrain-n47q-portable-evidence
          path: evidence/
          retention-days: 14
          if-no-files-found: error
