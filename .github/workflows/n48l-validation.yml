name: N48L paired quality and main cost
on:
  push:
    branches: [main, 'feature/n48l-model-evaluation']
    paths: ['tools/acceptance/**', 'include/qbrain/accounting/**', 'src/qbrain/main.cpp', '.github/workflows/n48l-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: n48l-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: portable
            suffix: ''
          - os: windows-latest
            platform: windows
            suffix: '.exe'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pin exact source
        shell: bash
        run: |
          set -euo pipefail
          mkdir evidence
          git rev-parse HEAD > evidence/source.txt
          git archive --format=zip --output=evidence/source.zip HEAD
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: runner.os != 'Windows'
        with:
          ref: b810d6898dcbbcd49bdbbed1d8473a3ac1c063e4
          path: baseline-source
          persist-credentials: false
      - name: Fresh Windows native product and original full60
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-tests-cl.ps1 2>&1 | Tee-Object evidence/native.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import sys,pathlib;sys.path.insert(0,'.ci');from validate_native_log import verified_groups;print(len(verified_groups(pathlib.Path('tests/test_main.cpp').read_text(),pathlib.Path('evidence/native.log').read_text(encoding='utf-8-sig'),60)))" | Tee-Object evidence/native-groups.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item build/cl/qbrain.exe evidence/qbrain.exe
          Invoke-WebRequest 'https://github.com/youq616/qbrain/releases/download/windows-current-preview-b810d689/qbrain-windows-x64-n47x-preview.zip' -OutFile baseline.zip
          if ((Get-FileHash baseline.zip -Algorithm SHA256).Hash.ToLowerInvariant() -cne 'c517582c1ea0e0795e881155edd4d34288e3a002dc3bc7657dafcb96a1eb8b4d') { throw 'Baseline mismatch' }
          Expand-Archive baseline.zip baseline
          Copy-Item baseline/qbrain.exe evidence/baseline-qbrain.exe
      - name: Fresh portable product and original core
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S baseline-source -B baseline-source/build/base -DCMAKE_BUILD_TYPE=Release -DQBRAIN_WITH_PG=OFF
          cmake --build baseline-source/build/base --target qbrain --parallel 2 > evidence/baseline-build.log 2>&1
          cp baseline-source/build/base/qbrain evidence/baseline-qbrain
          cmake -S . -B build/product -DCMAKE_BUILD_TYPE=Release -DQBRAIN_WITH_PG=OFF
          cmake --build build/product --target qbrain qbrain_memory_tests qbrain_context_tests qbrain_fact_tests qbrain_multiterm_tests qbrain_usage_batch_tests qbrain_usage_batch_ownership_tests --parallel 2 > evidence/product-build.log 2>&1
          ctest --test-dir build/product -R 'qbrain_(memory|context|fact|multiterm|usage_batch|usage_batch_ownership)_unit' --output-on-failure | tee evidence/core-ctest.log
          cp build/product/qbrain evidence/qbrain
      - name: New paired quality and cost with actual native program
        shell: bash
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          python tools/acceptance/test_model_evaluation.py --binary "evidence/qbrain${SUFFIX}" --evidence evidence/evaluation-normal 2>&1 | tee evidence/evaluation-normal.log
          python -O tools/acceptance/test_model_evaluation.py --binary "evidence/qbrain${SUFFIX}" --evidence evidence/evaluation-optimized 2>&1 | tee evidence/evaluation-optimized.log
      - name: Bridge tests and actual loopback pipeline in both Python modes
        shell: bash
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          python tools/acceptance/test_model_cost.py --binary "evidence/qbrain${SUFFIX}" --evidence evidence/bridge-normal 2>&1 | tee evidence/bridge-normal.log
          python -O tools/acceptance/test_model_cost.py --binary "evidence/qbrain${SUFFIX}" --evidence evidence/bridge-optimized 2>&1 | tee evidence/bridge-optimized.log
      - name: Retain original acceptance tools and native accounting/application gates
        shell: bash
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          (cd tools/acceptance && python -m unittest -v test_memory_tasks test_memory_metrics test_model_ab test_model_projection test_model_framing) 2>&1 | tee evidence/acceptance-normal.log
          (cd tools/acceptance && python -O -m unittest -v test_memory_tasks test_memory_metrics test_model_ab test_model_projection test_model_framing) 2>&1 | tee evidence/acceptance-optimized.log
          python .ci/run_n48i_checks.py --binary "evidence/qbrain${SUFFIX}" --baseline "evidence/baseline-qbrain${SUFFIX}" --output evidence/retained | tee evidence/retained-summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qbrain-n48l-${{ matrix.platform }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
