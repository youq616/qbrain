name: Apply verified native validation repair
on:
  push:
    branches: ['optimization/n42-foundation']
    paths: ['.github/workflows/apply-native-repair.yml']
permissions:
  contents: read
jobs:
  repair:
    if: github.repository == 'youq616/qbrain'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Check exact patch and preimages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          files = {
            '.ci/windows-repair.patch': '11fa0dca92e086f5d93d33d5cba9749491f851b68a9c42d400112b425a022c3f',
            'src/qbrain/codeintel/astlite.cpp': '2d47153531f54a5a9886d63da1999fa968cbb3d48eb9c189b1994b16d1a15d38',
            '.ci/test_mcp_boundaries.py': 'a206e3c5c5e79ae745135c7d14faa84ddc892b7928c33c1830410fffbb1aeff0',
            'tests/test_n32.cpp': '5943e1fd10fb04cd227501e484a3d55df749306fb9e6076891bf27824ca8fc49',
            'tests/n42/CMakeLists.txt': 'cf1bfa7eb5226f45a246e46dd511f4abd6af224e75c0a0df1ef840ff3bcd8888',
          }
          for name, digest in files.items():
              if hashlib.sha256(Path(name).read_bytes()).hexdigest() != digest:
                  raise SystemExit('Preimage mismatch: ' + name)
          PY
          git apply --check .ci/windows-repair.patch
          git apply .ci/windows-repair.patch
      - name: Commit exact source repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/qbrain/codeintel/astlite.cpp .ci/test_mcp_boundaries.py tests/test_n32.cpp tests/n42/CMakeLists.txt
          git commit -m 'fix(windows): recognize CRLF macro continuation and close test SQLite handles'
          git push origin HEAD:refs/heads/optimization/n42-foundation
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
