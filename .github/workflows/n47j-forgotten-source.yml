name: N47J fixed forgotten-trace source transfer
on:
  push:
    branches: ['delivery/n47j-forgotten-trace-objects']
    paths: ['.github/workflows/n47j-forgotten-source.yml']
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 35b41e7e2d7dff99a80a9c8bd4ca703e540058a5
          path: candidate
          persist-credentials: false
      - name: Verify fixed patch and upload source blobs without moving refs
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import hashlib,json,lzma,subprocess
          from pathlib import Path
          root=Path('candidate').resolve()
          packed=Path('transport/transfer/n47j-forgotten.xz').read_bytes()
          assert len(packed)==4708 and hashlib.sha256(packed).hexdigest()=='f8a96ab067a0212f106276a34a824e0797b9184dce5e3c0aade551c2158c8a57'
          decoder=lzma.LZMADecompressor(memlimit=128*1024*1024)
          raw=decoder.decompress(packed,max_length=65536)
          assert decoder.eof and not decoder.unused_data and len(raw)==14237
          data=json.loads(raw)
          def git(*args):return subprocess.check_output(['git','-C',str(root),*args],timeout=30).decode().strip()
          assert data['base']=='35b41e7e2d7dff99a80a9c8bd4ca703e540058a5' and git('rev-parse','HEAD')==data['base']
          assert data['base_tree']==git('rev-parse','HEAD^{tree}')=='faeb9ae0299535ec4b9bae1d2549543559ff4d61'
          allowed={'.ci/test_hook_trace_process.py','.ci/test_hook_trace_report.py','.ci/validate_hook_trace_report.py','docs/integration/HOOK-DIAGNOSTIC-CHECKPOINTS.zh-CN.md','include/qbrain/integration/detail/hook_trace.hpp','tests/test_n47j.cpp'}
          assert len(data['files'])==6 and {e['path'] for e in data['files']}==allowed
          for e in data['files']:assert git('rev-parse','HEAD:'+e['path'])==e['old_sha']
          patch=Path('verified.patch').resolve();patch.write_text(data['patch'],encoding='utf-8',newline='')
          subprocess.run(['git','-C',str(root),'apply','--index',str(patch)],check=True,timeout=30)
          assert set(git('diff','--cached','--name-only').splitlines())==allowed
          rows=[]
          for e in data['files']:
              content=(root/e['path']).read_bytes()
              digest=hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest()
              assert digest==e['sha']==git('rev-parse',':'+e['path'])
              request=Path('request.json');request.write_text(json.dumps({'encoding':'utf-8','content':content.decode('utf-8')}),encoding='utf-8')
              response=json.loads(subprocess.check_output(['gh','api','--method','POST','repos/youq616/qbrain/git/blobs','--input',str(request)],timeout=60))
              assert response['sha']==digest
              rows.append({'path':e['path'],'mode':'100644','type':'blob','sha':digest})
          print(json.dumps({'result':'SOURCE_OBJECTS_UPLOADED','base':data['base'],'tree':git('write-tree'),'files':rows,'product_ref_changed':False,'product_tests_run':False}))
