name: N47W process bridge diagnostics
on:
  push:
    branches: [main, 'fix/n47w-transport-diagnostics']
    paths: ['scripts/Invoke-QbrainJson.ps1', '.ci/*bridge_diagnostic*', '.github/workflows/n47w-validation.yml']
  pull_request:
    paths: ['scripts/Invoke-QbrainJson.ps1', '.ci/*bridge_diagnostic*', '.github/workflows/n47w-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: n47w-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Source archive and strict diagnostic checker regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir evidence
          git rev-parse HEAD > evidence/source.txt
          git archive --format=zip --output=evidence/qbrain-source.zip HEAD
          (cd .ci && python -m unittest test_bridge_diagnostic_checker -v) 2>&1 | tee evidence/checker.log
          (cd .ci && python -O -m unittest test_bridge_diagnostic_checker -v) 2>&1 | tee evidence/checker-optimized.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qbrain-n47w-source
          path: evidence/
          retention-days: 14
          if-no-files-found: error
  transport:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a3436c09e1eaed1d1e4eb6dcfaffbe19cc443eca
          path: prior
          persist-credentials: false
      - name: Compile test child and pin original runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory evidence | Out-Null
          git rev-parse HEAD | Set-Content evidence/source.txt
          Add-Type -Path .ci/bridge_diagnostic_child.cs -OutputAssembly evidence/bridge-child.exe -OutputType ConsoleApplication
          Copy-Item scripts/Invoke-QbrainJson.ps1 evidence/bridge.ps1
          Copy-Item prior/scripts/Invoke-QbrainJson.ps1 evidence/prior-bridge.ps1
          Invoke-WebRequest 'https://github.com/youq616/qbrain/releases/download/windows-integrated-preview-9e9a92b0/qbrain-windows-x64-n47r-preview.zip' -OutFile runtime.zip -UseBasicParsing
          if ((Get-FileHash runtime.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'e7158949d805a0a25157bfb720561e4b21e80a433a6c7f031c60ee3bbaa746c5') { throw 'Wrong runtime package' }
          Expand-Archive runtime.zip runtime
          if ((Get-FileHash runtime/qbrain.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'c35fadde8c8356b7243bf0b34cfd5c836bda27bb46da87eddcc79c1031bf05b5') { throw 'Wrong runtime EXE' }
      - name: Actual start input process and output failure observations
        shell: pwsh
        env:
          TEST_SHELL: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'
          $major = if ($env:TEST_SHELL -eq 'powershell') { 5 } else { 7 }
          & $env:TEST_SHELL -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .ci/test_bridge_diagnostics.ps1 -Bridge scripts/Invoke-QbrainJson.ps1 -PriorBridge prior/scripts/Invoke-QbrainJson.ps1 -Child evidence/bridge-child.exe -Report evidence/diagnostics.json 2>&1 | Tee-Object evidence/diagnostics.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .ci/check_bridge_diagnostics.py --report evidence/diagnostics.json --bridge scripts/Invoke-QbrainJson.ps1 --prior prior/scripts/Invoke-QbrainJson.ps1 --test .ci/test_bridge_diagnostics.ps1 --child evidence/bridge-child.exe --source $env:GITHUB_SHA --shell $major 2>&1 | Tee-Object evidence/diagnostics-readback.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Unchanged snapshot recovery and original five installer suites
        shell: pwsh
        env:
          TEST_SHELL: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'
          $major = if ($env:TEST_SHELL -eq 'powershell') { 5 } else { 7 }
          & $env:TEST_SHELL -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .ci/test_installer_snapshot.ps1 -Binary runtime/qbrain.exe -Report evidence/snapshot.json 2>&1 | Tee-Object evidence/snapshot.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .ci/check_installer_snapshot_report.py --report evidence/snapshot.json --installer scripts/Install-QbrainMemory.ps1 --test .ci/test_installer_snapshot.ps1 --binary runtime/qbrain.exe --source $env:GITHUB_SHA --shell $major
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:TEST_SHELL -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .ci/test_installer_recovery.ps1 -Binary runtime/qbrain.exe -Report evidence/recovery.json 2>&1 | Tee-Object evidence/recovery.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .ci/check_recovery_report.py --report evidence/recovery.json --installer scripts/Install-QbrainMemory.ps1 --binary runtime/qbrain.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in @('test_install_hooks','test_install_consent','test_windows_transport')) {
            & $env:TEST_SHELL -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".ci/$name.ps1" -Binary runtime/qbrain.exe 2>&1 | Tee-Object "evidence/$name.log"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          foreach ($name in @('test_hook_fact_install','test_promotion_install')) {
            & $env:TEST_SHELL -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".ci/$name.ps1" -Binary runtime/qbrain.exe -Report "evidence/$name.json" 2>&1 | Tee-Object "evidence/$name.log"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qbrain-n47w-${{ matrix.shell }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
  full-native:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Full unchanged native application and unit suite
        shell: pwsh
        run: |
          New-Item -ItemType Directory evidence | Out-Null
          git rev-parse HEAD | Set-Content evidence/source.txt
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-tests-cl.ps1 2>&1 | Tee-Object evidence/native.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import sys,pathlib;sys.path.insert(0,'.ci');from validate_native_log import verified_groups;print(len(verified_groups(pathlib.Path('tests/test_main.cpp').read_text(),pathlib.Path('evidence/native.log').read_text(encoding='utf-8-sig'),60)))" 2>&1 | Tee-Object evidence/native-groups.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qbrain-n47w-full-native
          path: evidence/
          retention-days: 14
          if-no-files-found: error
