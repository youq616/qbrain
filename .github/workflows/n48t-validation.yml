name: N48T SQLite directory cache
on:
  push:
    branches: ['feature/n48t-directory-cache']
    paths: ['src/qbrain/context/context.cpp', 'include/qbrain/context/sqlite_cache.hpp', 'include/qbrain/storage/database.hpp', 'src/qbrain/storage/transaction_state.cpp', 'tests/test_context_invalidation.cpp', 'tests/test_context_preflight.cpp', '.ci/test_context_invalidation.py', '.ci/context_invalidation_targets.cmake', '.github/workflows/n48t-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: n48t-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fixed source and no packaging changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir evidence
          git rev-parse HEAD > evidence/source.txt
          git rev-parse HEAD^{tree} > evidence/tree.txt
          git archive --format=zip --output=evidence/source.zip HEAD
          git ls-tree -r HEAD > evidence/source-tree.txt
      - name: Build native default SQLite path
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/n48t -DCMAKE_BUILD_TYPE=Debug -DQBRAIN_WITH_PG=OFF -DCMAKE_PROJECT_qbrain_INCLUDE="$GITHUB_WORKSPACE/.ci/context_invalidation_targets.cmake" > evidence/configure.log 2>&1
          cmake --build build/n48t --config Debug --target qbrain qbrain_context_invalidation_tests qbrain_context_preflight_tests qbrain_context_tests qbrain_pg_context_tests qbrain_memory_tests qbrain_fact_tests qbrain_hook_fact_tests qbrain_multiterm_tests qbrain_usage_batch_tests qbrain_usage_batch_ownership_tests --parallel 2 > evidence/build.log 2>&1
      - name: New policy and original core regressions
        shell: bash
        run: |
          set -euo pipefail
          suffix=''; config=''
          if [ "$RUNNER_OS" = Windows ]; then suffix='.exe'; config='Debug/'; fi
          cp "build/n48t/${config}qbrain${suffix}" "evidence/qbrain${suffix}"
          "build/n48t/${config}qbrain_context_invalidation_tests${suffix}" > evidence/new-native.json
          "build/n48t/${config}qbrain_context_preflight_tests${suffix}" > evidence/preflight-native.json
          "build/n48t/${config}qbrain_pg_context_tests${suffix}" --sqlite-only > evidence/original-context.json
          ctest --test-dir build/n48t -C Debug -R '^qbrain_(context_preflight|context_invalidation|context|memory|fact|hook_fact|multiterm|usage_batch|usage_batch_ownership)_unit$' --output-on-failure | tee evidence/ctest.log
          for mode in normal optimized; do
            opt=(); if [ "$mode" = optimized ]; then opt=(-O); fi
            python "${opt[@]}" .ci/test_context_invalidation.py --binary "evidence/qbrain${suffix}" --output "evidence/matrix-$mode" > "evidence/matrix-$mode.log"
            python "${opt[@]}" .ci/test_context_process.py --binary "evidence/qbrain${suffix}" --report "evidence/original-process-$mode.json" > "evidence/original-process-$mode.log"
            python "${opt[@]}" .ci/test_hooks.py --binary "evidence/qbrain${suffix}" > "evidence/hooks-$mode.log"
            python "${opt[@]}" .ci/test_memory_cycle.py --binary "evidence/qbrain${suffix}" > "evidence/memory-cycle-$mode.log"
          done
          git diff --exit-code > evidence/after-diff.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qbrain-n48t-${{ matrix.os }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
