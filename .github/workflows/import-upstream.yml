name: Import pinned Qbrain baseline

on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-upstream.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qbrain-initial-import
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'youq616/qbrain'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: main
      - name: Import exact upstream revision on an isolated branch
        shell: bash
        env:
          BASE: 2e5c4f0bf310ca4f340b3a2295d2dfd79d3b8325
          TARGET: import/upstream-n41
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$TARGET" >/dev/null 2>&1; then
            echo 'Import branch already exists; no changes made.'
            exit 0
          fi
          git fetch --no-tags https://github.com/Lordakee/qbrain.git "$BASE"
          test "$(git rev-parse FETCH_HEAD)" = "$BASE"
          git switch -c "$TARGET"
          git archive "$BASE" | tar -x -C "$GITHUB_WORKSPACE"
          mkdir -p docs/integration
          printf '# Imported baseline\n\nSource: Lordakee/qbrain\nCommit: `%s`\n\nThis is an unmodified source snapshot imported for review. Upstream audit and test claims are historical, not new validation. Any dist binaries are upstream artifacts, not optimized builds. N42 patches and Windows validation are separate changes.\n' "$BASE" > docs/integration/BASELINE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: import MIT-licensed qbrain baseline at 2e5c4f0'
          git push origin "HEAD:refs/heads/$TARGET"
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git ls-remote origin "refs/heads/$TARGET" | cut -f1)
          test "$LOCAL" = "$REMOTE"
          printf '## Verified import\n\nBranch: `%s`\n\nCommit: `%s`\n' "$TARGET" "$LOCAL" >> "$GITHUB_STEP_SUMMARY"
