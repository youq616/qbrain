name: Apply reviewed native compatibility fixes once
on:
  push:
    branches: ['optimization/n44-context-release']
    paths: ['.github/workflows/n44-finish-compatibility.yml']
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'youq616/qbrain'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Verify exact eight files and preserve branch updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,subprocess,tempfile,urllib.request
          root=pathlib.Path.cwd()
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          def digest(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          assert os.environ['GITHUB_REF']=='refs/heads/optimization/n44-context-release'
          assert git('rev-parse','HEAD^')=='3aadb0dae35b2691c5c1679bb33ba7c6a580d4d7'
          sha='426dfc0d95629c8ef6072e5cc625c0e224af1f8a'
          req=urllib.request.Request('https://api.github.com/repos/youq616/qbrain/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as res: blob=json.load(res)
          text=base64.b64decode(blob['content'])
          assert hashlib.sha1(b'blob '+str(len(text)).encode()+b'\0'+text).hexdigest()==sha
          compressed=base64.b64decode(text,validate=True)
          assert hashlib.sha256(compressed).hexdigest()=='53eae0cdcddd99813b505a16d08e404544532f2598cc8d1f1b4ce344a4705131'
          decoder=lzma.LZMADecompressor(memlimit=268435456)
          raw=decoder.decompress(compressed,max_length=10313)
          assert len(raw)==10312 and decoder.eof and not decoder.unused_data
          bundle=json.loads(raw)
          allowed={'.ci/package_n44_development.py','.ci/test_local_config.py','.ci/test_validate_native_log.py','.ci/validate_native_log.py','include/qbrain/core/brain.hpp','scripts/Install-QbrainMemory.ps1','src/qbrain/cli/commands.cpp','src/qbrain/core/brain.cpp'}
          assert set(bundle)=={'patch','files'} and set(bundle['files'])==allowed
          for name,entry in bundle['files'].items():
              p=root/name
              assert not p.is_symlink() and p.resolve().is_relative_to(root)
              assert (not p.exists()) if entry['before'] is None else digest(p)==entry['before'],name
          with tempfile.TemporaryDirectory() as tmp:
              patch=pathlib.Path(tmp)/'fix.patch';patch.write_text(bundle['patch'],encoding='utf-8')
              subprocess.run(['git','apply','--check',str(patch)],check=True)
              subprocess.run(['git','apply',str(patch)],check=True)
          for name,entry in bundle['files'].items(): assert digest(root/name)==entry['after'],name
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['python3','.ci/test_validate_native_log.py'],check=True)
          git('config','user.name','github-actions[bot]');git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('add','--',*sorted(allowed))
          git('commit','-m','fix: keep project memory configuration local and verify exact native groups')
          assert git('ls-remote','origin',os.environ['GITHUB_REF']).split()[0]==os.environ['GITHUB_SHA'],'Concurrent branch edit'
          git('push','origin','HEAD:'+os.environ['GITHUB_REF'])
          print('Verified eight files; source commit',git('rev-parse','HEAD'))
          PY
