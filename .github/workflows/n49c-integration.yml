name: N49C integrated client and retrieval qualification
permissions:
  contents: read
concurrency:
  group: n49c-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
env:
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  cmake:
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-24.04
        - windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 1
      id: checkout
      timeout-minutes: 2
    - name: Exact candidate ancestry and independent inventory binding
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = '${{ github.sha }}'
        if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
          git fetch --no-tags --no-recurse-submodules --unshallow origin '${{ github.sha }}'
        fi
        test "$(git rev-parse --is-shallow-repository)" = false
        python -c "import hashlib,subprocess,sys; raw=subprocess.check_output(['git','show','HEAD:docs/nodes/n49c-evidence/INPUT-INVENTORY.json']);sys.exit(0 if hashlib.sha256(raw).hexdigest()=='5e0e87d28d2acb2a2409682b9d9618fc2a6bf43bba2b2c2392f7a6ba4ba40b0e' else 1)"
        echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
        git show '${{ github.sha }}:.ci/check_n49c_sources.py' > "$RUNNER_TEMP/n49c-frozen-source-gate.py"
      id: source_identity
      timeout-minutes: 1
    - name: Capture exact source and unchanged build closures
      id: source_capture
      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        bindir=build/n49c; suffix=''
        if [ "$RUNNER_OS" = Windows ]; then bindir=build/n49c/Debug; suffix=.exe; fi
        script="$RUNNER_TEMP/n49c-source_capture.sh"
        cat > "$script" <<'N49C_CLEAN_COMMAND'
        set -euo pipefail
        mkdir -p evidence
        test "$(git rev-parse HEAD)" = '${{ github.sha }}'
        git rev-parse HEAD > evidence/source.txt
        git rev-parse HEAD^{tree} > evidence/tree.txt
        git ls-tree -r -z HEAD > evidence/source-tree.bin
        git archive --format=zip --output=evidence/source.zip HEAD
        python .ci/check_n49c_sources.py > evidence/source-closure.json
        N49C_CLEAN_COMMAND
        observed_bash="$BASH"
        process_exe="$(readlink -f /proc/$$/exe)"
        test "$observed_bash" -ef "$process_exe"
        native_exe="$process_exe"
        native_script="$(readlink -f "$script")"
        converter=''
        if [ "$RUNNER_OS" = Windows ]; then
          converter="$(command -v cygpath)"
          native_exe="$("$converter" -am "$process_exe")"
          native_script="$("$converter" -am "$script")"
        fi
        export N49C_TEST_BASH="$native_exe"
        phase_args=(--phase-root evidence/phases --phase-platform "$RUNNER_OS" --expected-head '${{ github.sha }}' --expected-tree '${{ steps.source_identity.outputs.tree }}' --run-id '${{ github.run_id }}' --run-attempt '${{ github.run_attempt }}' --job-key cmake --job-label 'qbrain-n49c-cmake-${{ matrix.os }}')
        binary_args=()
        phase_start_sha="$(python .ci/check_n49c_sources.py --phase-start source_capture "${phase_args[@]}" --phase-script "$native_script" "${binary_args[@]}")"
        printf 'start_sha256=%s\n' "$phase_start_sha" >> "$GITHUB_OUTPUT"
        set +e
        MSYS2_ARG_CONV_EXCL='*' python .ci/check_n49c_sources.py --run-clean-bash "$native_exe" --bash-version "$BASH_VERSION" --script "$native_script" --shell-report evidence/launcher-source_capture.json --observed-bash "$observed_bash" --observed-process-exe "$process_exe" --observed-script "$script" --converter "$converter" > evidence/phases/source_capture/stdout.raw 2> evidence/phases/source_capture/stderr.raw
        command_status=$?
        phase_result_sha="$(python .ci/check_n49c_sources.py --phase-finish source_capture "${phase_args[@]}" --phase-start-sha "$phase_start_sha" --phase-exit "$command_status")"
        metadata_status=$?
        set -e
        printf 'result_sha256=%s\n' "$phase_result_sha" >> "$GITHUB_OUTPUT"
        if [ "$command_status" -ne 0 ]; then exit "$command_status"; fi
        exit "$metadata_status"
    - name: Fresh CMake build and Windows original60
      id: cmake_build
      timeout-minutes: 18
      shell: bash
      run: |
        set -euo pipefail
        bindir=build/n49c; suffix=''
        if [ "$RUNNER_OS" = Windows ]; then bindir=build/n49c/Debug; suffix=.exe; fi
        script="$RUNNER_TEMP/n49c-cmake_build.sh"
        cat > "$script" <<'N49C_CLEAN_COMMAND'
        set -euo pipefail
        cmake -S . -B build/n49c -DCMAKE_BUILD_TYPE=Debug -DQBRAIN_WITH_PG=OFF -DCMAKE_PROJECT_qbrain_INCLUDE="$GITHUB_WORKSPACE/.ci/client_retrieval_integration_targets.cmake" > evidence/configure.log 2>&1
        cmake --build build/n49c --config Debug --target qbrain qbrain_client_retrieval_integration_tests qbrain_directory_search_tests qbrain_cursor_hook_tests qbrain_verified_integration_tests qbrain_context_invalidation_tests qbrain_context_preflight_tests qbrain_context_coverage_tests qbrain_query_cache_tests qbrain_query_cache_integration_tests qbrain_query_cache_http_tests qbrain_logical_observation_tests qbrain_logical_observation_http_tests qbrain_logical_rerank_move_tests qbrain_logical_rerank_regression qbrain_runtime_observation_tests qbrain_observation_semantics_tests qbrain_runtime_observation_http qbrain_memory_tests qbrain_context_tests qbrain_http_tests qbrain_http_probe qbrain_retrieval_tests qbrain_embedding_tests qbrain_embedding_queue_tests qbrain_cjk_tests qbrain_fact_tests qbrain_conflict_tests qbrain_recall_tests qbrain_hook_fact_tests qbrain_promotion_tests qbrain_lifecycle_tests qbrain_lifecycle_batch_tests qbrain_lifecycle_candidate_tests qbrain_strict_json_tests qbrain_hook_trace_tests qbrain_hook_diagnostic_tests qbrain_multiterm_tests qbrain_usage_batch_tests qbrain_usage_batch_ownership_tests qbrain_pg_fact_tests qbrain_pg_context_tests qbrain_pg_hook_tests --parallel 2 > evidence/build.log 2>&1
        if [ "$RUNNER_OS" = Windows ]; then
          cmake --build build/n49c --config Debug --target qbrain_tests --parallel 2 > evidence/full60-build.log 2>&1
          build/n49c/Debug/qbrain_tests.exe > evidence/full60.log 2>&1
          python -c "import sys,pathlib;sys.path.insert(0,'.ci');from validate_native_log import verified_groups;print(len(verified_groups(pathlib.Path('tests/test_main.cpp').read_text(),pathlib.Path('evidence/full60.log').read_text(encoding='utf-8-sig'),60)))" > evidence/full60-verified.txt
        fi
        N49C_CLEAN_COMMAND
        observed_bash="$BASH"
        process_exe="$(readlink -f /proc/$$/exe)"
        test "$observed_bash" -ef "$process_exe"
        native_exe="$process_exe"
        native_script="$(readlink -f "$script")"
        converter=''
        if [ "$RUNNER_OS" = Windows ]; then
          converter="$(command -v cygpath)"
          native_exe="$("$converter" -am "$process_exe")"
          native_script="$("$converter" -am "$script")"
        fi
        export N49C_TEST_BASH="$native_exe"
        phase_args=(--phase-root evidence/phases --phase-platform "$RUNNER_OS" --expected-head '${{ github.sha }}' --expected-tree '${{ steps.source_identity.outputs.tree }}' --run-id '${{ github.run_id }}' --run-attempt '${{ github.run_attempt }}' --job-key cmake --job-label 'qbrain-n49c-cmake-${{ matrix.os }}')
        binary_args=()
        phase_start_sha="$(python .ci/check_n49c_sources.py --phase-start cmake_build "${phase_args[@]}" --phase-script "$native_script" "${binary_args[@]}")"
        printf 'start_sha256=%s\n' "$phase_start_sha" >> "$GITHUB_OUTPUT"
        set +e
        MSYS2_ARG_CONV_EXCL='*' python .ci/check_n49c_sources.py --run-clean-bash "$native_exe" --bash-version "$BASH_VERSION" --script "$native_script" --shell-report evidence/launcher-cmake_build.json --observed-bash "$observed_bash" --observed-process-exe "$process_exe" --observed-script "$script" --converter "$converter" > evidence/phases/cmake_build/stdout.raw 2> evidence/phases/cmake_build/stderr.raw
        command_status=$?
        phase_result_sha="$(python .ci/check_n49c_sources.py --phase-finish cmake_build "${phase_args[@]}" --phase-start-sha "$phase_start_sha" --phase-exit "$command_status" --phase-produced-binary "$bindir/qbrain$suffix")"
        metadata_status=$?
        set -e
        printf 'result_sha256=%s\n' "$phase_result_sha" >> "$GITHUB_OUTPUT"
        if [ "$command_status" -ne 0 ]; then exit "$command_status"; fi
        exit "$metadata_status"
    - name: Fresh combined CTests
