name: N48Q independent outcome review
on:
  push:
    branches: [main, 'feature/n48q-pg-facts-receipts']
    paths: ['.ci/review_pg_facts_closeout.py', '.github/workflows/n48q-outcome.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: n48q-outcome-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            suffix: ''
            config: ''
          - os: windows-2022
            platform: windows
            suffix: '.exe'
            config: 'Release/'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Freeze source and prove unchanged runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir evidence
          git rev-parse HEAD > evidence/source.txt
          git rev-parse HEAD^{tree} > evidence/tree.txt
          git diff --exit-code 4f8b470f32df106c9bb596f24252ffb800773b47 HEAD -- src include tests CMakeLists.txt > evidence/runtime-diff.txt
          git archive --format=zip --output=evidence/source.zip HEAD
          python -m py_compile .ci/review_pg_facts_closeout.py
      - name: Disposable PostgreSQL on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          pg_bin="$(dirname "$(find /usr/lib/postgresql -path '*/bin/initdb' | sort -V | tail -1)")"
          test -x "$pg_bin/initdb"
          "$pg_bin/initdb" -D "$RUNNER_TEMP/n48q-review-pg" -U postgres --auth=trust --encoding=UTF8 --no-locale > evidence/pg-init.log
          mkdir "$RUNNER_TEMP/n48q-review-socket"
          "$pg_bin/pg_ctl" -D "$RUNNER_TEMP/n48q-review-pg" -l "$GITHUB_WORKSPACE/evidence/pg-server.log" -o "-h 127.0.0.1 -p 55432 -k $RUNNER_TEMP/n48q-review-socket" -w start
          export PGHOST=127.0.0.1 PGPORT=55432 PGUSER=postgres
          "$pg_bin/psql" -X -v ON_ERROR_STOP=1 -d postgres -c "CREATE ROLE qbrain_n48o LOGIN PASSWORD 'n48q-review-synthetic'"
          for name in qbrain_n48q_native qbrain_n48q_process qbrain_n48q_review_normal qbrain_n48q_review_optimized qbrain_n48p_native qbrain_n48o_native; do
            "$pg_bin/createdb" -O qbrain_n48o "$name"
          done
          echo "$pg_bin" >> "$GITHUB_PATH"
          printf 'PGHOST=127.0.0.1\nPGPORT=55432\nPGUSER=qbrain_n48o\nPGPASSWORD=n48q-review-synthetic\n' >> "$GITHUB_ENV"
          "$pg_bin/postgres" --version | tee evidence/postgres-version.txt
      - name: Disposable PostgreSQL on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if (-not $env:PGROOT -or -not (Test-Path "$env:PGROOT\lib\libpq.lib")) { throw 'Native PostgreSQL/libpq required' }
          $service=Get-Service 'postgresql-x64-*' | Select-Object -First 1
          Set-Service $service.Name -StartupType Manual
          Start-Service $service.Name
          $env:PGHOST='127.0.0.1'; $env:PGPORT='5432'; $env:PGUSER='postgres'; $env:PGPASSWORD='root'
          & "$env:PGROOT\bin\psql.exe" -X -v ON_ERROR_STOP=1 -d postgres -c "CREATE ROLE qbrain_n48o LOGIN PASSWORD 'n48q-review-synthetic'"
          if ($LASTEXITCODE -ne 0) { throw 'Create disposable role failed' }
          foreach ($name in @('qbrain_n48q_native','qbrain_n48q_process','qbrain_n48q_review_normal','qbrain_n48q_review_optimized','qbrain_n48p_native','qbrain_n48o_native')) {
            & "$env:PGROOT\bin\createdb.exe" -O qbrain_n48o $name
            if ($LASTEXITCODE -ne 0) { throw 'Create disposable database failed' }
          }
          "$env:PGROOT\bin" | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          "QBRAIN_PG_ROOT=$env:PGROOT" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          'PGHOST=127.0.0.1','PGPORT=5432','PGUSER=qbrain_n48o','PGPASSWORD=n48q-review-synthetic' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          & "$env:PGROOT\bin\postgres.exe" --version | Tee-Object evidence/postgres-version.txt
      - name: Fresh native product and retained core
        shell: bash
        env:
          SUFFIX: ${{ matrix.suffix }}
          CONFIG: ${{ matrix.config }}
        run: |
          set -euo pipefail
          cmake -S . -B build/review -DCMAKE_BUILD_TYPE=Release -DQBRAIN_WITH_PG=ON -DQBRAIN_REQUIRE_PG=ON > evidence/configure.log 2>&1
          cmake --build build/review --config Release --target qbrain qbrain_pg_fact_tests qbrain_pg_context_tests qbrain_pg_memory_tests qbrain_pg_memory_scope_tests qbrain_memory_tests qbrain_context_tests qbrain_fact_tests qbrain_multiterm_tests qbrain_usage_batch_tests qbrain_usage_batch_ownership_tests --parallel 2 > evidence/build.log 2>&1
          ctest --test-dir build/review -C Release -R 'qbrain_(memory|context|fact|multiterm|usage_batch|usage_batch_ownership)_unit' --output-on-failure | tee evidence/core.log
          cp "build/review/${CONFIG}qbrain${SUFFIX}" "evidence/qbrain${SUFFIX}"
          python -c "import hashlib,json,pathlib,os; p=pathlib.Path('evidence/qbrain'+os.environ['SUFFIX']); print(json.dumps({'binary_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'script_sha256':hashlib.sha256(pathlib.Path('.ci/review_pg_facts_closeout.py').read_bytes()).hexdigest()}))" | tee evidence/identities.json
      - name: Retained actual PostgreSQL facts context and memory tests
        shell: bash
        env:
          SUFFIX: ${{ matrix.suffix }}
          CONFIG: ${{ matrix.config }}
        run: |
          set -euo pipefail
          export QBRAIN_PG_FACT_TEST_DISPOSABLE=1 QBRAIN_PG_CONTEXT_TEST_DISPOSABLE=1 QBRAIN_PG_MEMORY_TEST_DISPOSABLE=1
          export QBRAIN_PG_FACT_TEST_DSN="host=127.0.0.1 port=$PGPORT dbname=qbrain_n48q_native user=qbrain_n48o password=n48q-review-synthetic"
          export QBRAIN_PG_CONTEXT_TEST_DSN="host=127.0.0.1 port=$PGPORT dbname=qbrain_n48p_native user=qbrain_n48o password=n48q-review-synthetic"
          export QBRAIN_PG_MEMORY_TEST_DSN="host=127.0.0.1 port=$PGPORT dbname=qbrain_n48o_native user=qbrain_n48o password=n48q-review-synthetic"
          "build/review/${CONFIG}qbrain_pg_fact_tests${SUFFIX}" | tee evidence/native-facts.json
          "build/review/${CONFIG}qbrain_pg_context_tests${SUFFIX}" | tee evidence/native-context.json
          "build/review/${CONFIG}qbrain_pg_memory_tests${SUFFIX}" | tee evidence/native-memory.json
          "build/review/${CONFIG}qbrain_pg_memory_scope_tests${SUFFIX}" | tee evidence/native-scope.json
          export QBRAIN_PG_FACT_PROCESS_DSN="host=127.0.0.1 port=$PGPORT dbname=qbrain_n48q_process user=qbrain_n48o password=n48q-review-synthetic"
          export PGDATABASE=qbrain_n48q_process
          python .ci/test_pg_facts.py --binary "evidence/qbrain${SUFFIX}" --output evidence/original-normal
          python -O .ci/test_pg_facts.py --binary "evidence/qbrain${SUFFIX}" --output evidence/original-optimized
      - name: Independent actual-process review in both Python modes
        shell: bash
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          export QBRAIN_N48Q_REVIEW_DISPOSABLE=1
          for mode in normal optimized; do
            opt=()
            if [ "$mode" = optimized ]; then opt=(-O); fi
            export PGDATABASE="qbrain_n48q_review_${mode}"
            export QBRAIN_N48Q_REVIEW_DSN="host=127.0.0.1 port=$PGPORT dbname=$PGDATABASE user=qbrain_n48o password=n48q-review-synthetic"
            python "${opt[@]}" .ci/review_pg_facts_closeout.py --binary "evidence/qbrain${SUFFIX}" --backend sqlite --output "evidence/review-sqlite-$mode" | tee "evidence/review-sqlite-$mode.log"
            python "${opt[@]}" .ci/review_pg_facts_closeout.py --binary "evidence/qbrain${SUFFIX}" --backend postgres --output "evidence/review-postgres-$mode" | tee "evidence/review-postgres-$mode.log"
          done
          git diff --exit-code -- src include tests .ci/review_pg_facts_closeout.py > evidence/after-runtime-diff.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qbrain-n48q-outcome-${{ matrix.platform }}
          path: evidence/
          retention-days: 30
          if-no-files-found: error
  sanitizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fresh SQLite fact tests with ASan and UBSan
        shell: bash
        run: |
          set -euo pipefail
          mkdir evidence
          git rev-parse HEAD > evidence/source.txt
          cmake -S . -B build/asan -DCMAKE_BUILD_TYPE=Debug -DQBRAIN_WITH_PG=OFF -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined' > evidence/configure.log 2>&1
          cmake --build build/asan --target qbrain_pg_fact_tests qbrain_fact_tests --parallel 2 > evidence/build.log 2>&1
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 build/asan/qbrain_pg_fact_tests --sqlite-only > evidence/new.stdout 2> evidence/new.stderr
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 build/asan/qbrain_fact_tests > evidence/original.stdout 2> evidence/original.stderr
          cat evidence/new.stdout evidence/original.stdout
          test ! -s evidence/new.stderr
          test ! -s evidence/original.stderr
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qbrain-n48q-outcome-sanitizer
          path: evidence/
          retention-days: 30
          if-no-files-found: error
