name: N47E fixed source-object transfer
on:
  push:
    branches: ['delivery/n47e-source-objects']
    paths: ['.github/workflows/n47e-source-objects.yml']
permissions:
  contents: read
jobs:
  source-objects:
    if: github.repository == 'youq616/qbrain' && github.ref == 'refs/heads/delivery/n47e-source-objects'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b69f7e1755bbb4c646261ef82e626bfe30faa562
          path: candidate
          persist-credentials: false
      - name: Validate exact patch and upload file objects without moving refs
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          import base64,hashlib,json,lzma,os,re,subprocess
          from pathlib import Path
          base='b69f7e1755bbb4c646261ef82e626bfe30faa562'
          tree='5cc4ae2860dbe2927c3ce8be6474b1dae1c68658'
          repo='youq616/qbrain';candidate=Path('candidate').resolve()
          root=Path(os.environ['RUNNER_TEMP'])/'n47e-source';root.mkdir()
          def git(*a):return subprocess.check_output(['git','-C',str(candidate),*a],stderr=subprocess.PIPE,timeout=30).decode().strip()
          encoded=''.join(Path(f'transport/transfer/n47e.{n}').read_text(encoding='ascii').strip() for n in range(6))
          assert len(encoded)==33356
          data=base64.b64decode(encoded,validate=True)
          assert len(data)==25016 and hashlib.sha256(data).hexdigest()=='1d1bc2d9c4af6b4a9c49623852cd1b9ece3390ccd81c719cba683fbab059437c'
          decoder=lzma.LZMADecompressor(memlimit=256*1024*1024)
          raw=decoder.decompress(data,max_length=512*1024)
          assert decoder.eof and not decoder.unused_data and len(raw)==102323
          document=json.loads(raw.decode('utf-8'))
          assert document['base']==base and git('rev-parse','HEAD')==base and git('rev-parse','HEAD^{tree}')==tree
          expected={'.ci/package_n44_development.py','.ci/test_promotion_install.ps1','.ci/test_promotion_process.py','.ci/test_promotion_report.py','.ci/test_promotion_unit.py','.ci/test_validate_native_log.py','.ci/validate_promotion_report.py','.github/workflows/n42-validation.yml','.github/workflows/n44-validation.yml','CMakeLists.txt','docs/integration/LOCAL-FACT-PROMOTION.zh-CN.md','include/qbrain/memory/fact_store.hpp','scripts/Install-QbrainMemory.ps1','scripts/build-tests-cl.ps1','src/qbrain/cli/commands.cpp','src/qbrain/integration/hook.cpp','src/qbrain/memory/fact_store.cpp','src/qbrain/ops/memory_ops.cpp','tests/test_main.cpp','tests/test_n47e.cpp'}
          entries=document['files'];assert len(entries)==20 and {x['path'] for x in entries}==expected
          for e in entries:
              assert re.fullmatch('[0-9a-f]{40}',e['sha'])
              if e['old_sha'] is None:
                  p=subprocess.run(['git','-C',str(candidate),'cat-file','-e','HEAD:'+e['path']],stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=30)
                  assert p.returncode!=0
              else:assert git('rev-parse','HEAD:'+e['path'])==e['old_sha']
          patch=root/'change.patch';patch.write_text(document['patch'],encoding='utf-8',newline='')
          assert hashlib.sha256(patch.read_bytes()).hexdigest()=='136416354a839e6ac153d58c7b83898d3c4eec8cdd027e8e023a09ffc7f220d7'
          subprocess.run(['git','-C',str(candidate),'apply','--unidiff-zero','--index',str(patch)],check=True,timeout=30)
          assert set(git('diff','--cached','--name-only').splitlines())==expected
          files=[]
          for e in entries:
              content=(candidate/e['path']).read_bytes()
              digest=hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest()
              assert digest==e['sha'] and git('rev-parse',':'+e['path'])==digest
              request=root/'request.json';request.write_text(json.dumps({'content':content.decode('utf-8'),'encoding':'utf-8'}),encoding='utf-8')
              response=json.loads(subprocess.check_output(['gh','api','--method','POST',f'repos/{repo}/git/blobs','--input',str(request)],stderr=subprocess.PIPE,timeout=60))
              assert response['sha']==digest
              files.append({'path':e['path'],'mode':'100644','type':'blob','sha':digest})
          result={'result':'SOURCE_OBJECTS_UPLOADED','base_commit':base,'base_tree':tree,'candidate_tree':git('write-tree'),'files':files,'product_commit_created':False,'product_branch_updated':False,'windows_tests_run_here':False}
          evidence=Path('evidence');evidence.mkdir()
          (evidence/'source-objects.json').write_text(json.dumps(result,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: n47e-source-objects
          path: evidence/source-objects.json
          retention-days: 14
