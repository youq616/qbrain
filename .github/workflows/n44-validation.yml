name: Native project memory and context validation
on:
  push:
    branches: ['optimization/n44-context-release','optimization/n46b-http-boundaries','optimization/n46c-exact-retrieval','optimization/n46d-embedding-contracts','optimization/n46f-cjk-recall','optimization/n47a-evidence-facts','optimization/n47b-conflict-reads','optimization/n47c-conflict-aware-recall','optimization/n47d-opt-in-hook-recall','optimization/n47e-local-fact-promotion','optimization/n47f-lifecycle-archive','optimization/n47g-atomic-lifecycle-batch','optimization/n47h-lifecycle-candidates','optimization/n47i-unambiguous-json','optimization/n47j-event-trace-checkpoints','optimization/n47k-diagnostic-inspection','optimization/n47l-multi-term-recall','optimization/n47m-memory-context-arguments','optimization/n47n-search-arguments','main']
    paths: ['src/**','include/**','tests/**','scripts/**','.ci/**','CMakeLists.txt','.github/workflows/n44-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: n44-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: git archive --format=zip --output=qbrain-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qbrain-n44-source
          path: qbrain-source.zip
          retention-days: 14
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build and exercise production processes without model credentials
        run: |
          set -euo pipefail
          mkdir evidence
          python3 .ci/test_validate_native_log.py 2>&1 | tee evidence/evidence-gate.log
          python3 .ci/test_http_lifecycle_report.py 2>&1 | tee evidence/lifecycle-report-gate.log
          python3 .ci/test_cjk_report.py 2>&1 | tee evidence/cjk-report-gate-tests.log
          python3 .ci/test_hook_fact_report.py 2>&1 | tee evidence/hook-fact-report-gate-tests.log
          python3 .ci/test_lifecycle_report.py 2>&1 | tee evidence/fact-lifecycle-report-gate-tests.log
          python3 .ci/test_lifecycle_candidate_report.py 2>&1 | tee evidence/candidate-report-gate-tests.log
          python3 .ci/test_lifecycle_batch_report.py 2>&1 | tee evidence/batch-report-gate-tests.log
          python3 .ci/test_promotion_report.py 2>&1 | tee evidence/promotion-report-gate-tests.log
          python3 .ci/test_strict_json_report.py 2>&1 | tee evidence/strict-json-report-gate-tests.log
          python3 .ci/test_hook_trace_report.py 2>&1 | tee evidence/hook-trace-report-gate-tests.log
          python3 .ci/test_hook_diagnostic_report.py 2>&1 | tee evidence/hook-diagnostic-report-gate-tests.log
          python3 .ci/test_fact_report.py 2>&1 | tee evidence/fact-report-gate-tests.log
          python3 .ci/test_recall_report.py 2>&1 | tee evidence/recall-report-gate-tests.log
          python3 .ci/test_multiterm_report.py 2>&1 | tee evidence/multiterm-report-gate-tests.log
          python3 .ci/test_conflict_report.py 2>&1 | tee evidence/conflict-report-gate-tests.log
          cmake -S . -B build/portable -DCMAKE_BUILD_TYPE=Release -DQBRAIN_WITH_PG=OFF
          cmake --build build/portable --target qbrain qbrain_memory_tests qbrain_context_tests qbrain_http_tests qbrain_retrieval_tests qbrain_embedding_tests qbrain_embedding_queue_tests qbrain_cjk_tests qbrain_fact_tests qbrain_conflict_tests qbrain_recall_tests qbrain_hook_fact_tests qbrain_promotion_tests qbrain_lifecycle_tests qbrain_lifecycle_batch_tests qbrain_lifecycle_candidate_tests qbrain_strict_json_tests qbrain_hook_trace_tests qbrain_hook_diagnostic_tests qbrain_multiterm_tests --parallel 2 2>&1 | tee evidence/build.log
          python3 .ci/test_retrieval_benchmark.py --binary build/portable/qbrain_retrieval_tests --report evidence/retrieval-benchmark.json | tee evidence/retrieval.log
          cmake -S tests/n42 -B build/n42 -DQBRAIN_N42_SQLITE_ADAPTER_TEST=ON
          cmake --build build/n42 --parallel 2
          ctest --test-dir build/n42 --output-on-failure | tee evidence/n42-regression.log
          python3 .ci/test_embedding_queue.py --binary build/portable/qbrain_embedding_queue_tests --report evidence/embedding-queue.json | tee evidence/embedding-queue.log
          python3 .ci/test_fact_unit.py --binary build/portable/qbrain_fact_tests --report evidence/fact-unit.json | tee evidence/fact-unit.log
          python3 .ci/test_fact_process.py --binary build/portable/qbrain --report evidence/fact-process.json | tee evidence/fact-process.log
          python3 .ci/test_hook_fact_unit.py --binary build/portable/qbrain_hook_fact_tests --report evidence/hook-fact-unit.json | tee evidence/hook-fact-unit.log
          python3 .ci/test_hook_fact_process.py --binary build/portable/qbrain --report evidence/hook-fact-process.json | tee evidence/hook-fact-process.log
          python3 .ci/test_lifecycle_unit.py --binary build/portable/qbrain_lifecycle_tests --report evidence/fact-lifecycle-unit.json | tee evidence/fact-lifecycle-unit.log
          python3 .ci/test_lifecycle_process.py --binary build/portable/qbrain --report evidence/fact-lifecycle-process.json | tee evidence/fact-lifecycle-process.log
          python3 .ci/test_strict_json_unit.py --binary build/portable/qbrain_strict_json_tests --report evidence/strict-json-unit.json | tee evidence/strict-json-unit.log
          python3 .ci/test_hook_trace_unit.py --binary build/portable/qbrain_hook_trace_tests --report evidence/hook-trace-unit.json | tee evidence/hook-trace-unit.log
          python3 .ci/test_hook_diagnostic_unit.py --binary build/portable/qbrain_hook_diagnostic_tests --report evidence/hook-diagnostic-unit.json | tee evidence/hook-diagnostic-unit.log
          python3 .ci/test_lifecycle_candidate_unit.py --binary build/portable/qbrain_lifecycle_candidate_tests --report evidence/candidate-unit.json | tee evidence/candidate-unit.log
          python3 .ci/test_lifecycle_batch_unit.py --binary build/portable/qbrain_lifecycle_batch_tests --report evidence/batch-unit.json | tee evidence/batch-unit.log
          python3 .ci/test_strict_json_process.py --binary build/portable/qbrain --report evidence/strict-json-process.json | tee evidence/strict-json-process.log
          python3 .ci/test_hook_trace_process.py --binary build/portable/qbrain --report evidence/hook-trace-process.json | tee evidence/hook-trace-process.log
          python3 .ci/test_hook_diagnostic_process.py --binary build/portable/qbrain --report evidence/hook-diagnostic-process.json | tee evidence/hook-diagnostic-process.log
          python3 .ci/test_lifecycle_candidate_process.py --binary build/portable/qbrain --report evidence/candidate-process.json | tee evidence/candidate-process.log
          python3 .ci/test_lifecycle_batch_process.py --binary build/portable/qbrain --report evidence/batch-process.json | tee evidence/batch-process.log
          python3 .ci/test_promotion_unit.py --binary build/portable/qbrain_promotion_tests --report evidence/promotion-unit.json | tee evidence/promotion-unit.log
          python3 .ci/test_promotion_process.py --binary build/portable/qbrain --report evidence/promotion-process.json | tee evidence/promotion-process.log
          python3 .ci/test_recall_unit.py --binary build/portable/qbrain_recall_tests --report evidence/recall-unit.json | tee evidence/recall-unit.log
          python3 .ci/test_multiterm_unit.py --binary build/portable/qbrain_multiterm_tests --report evidence/multiterm-unit.json | tee evidence/multiterm-unit.log
          python3 .ci/test_recall_process.py --binary build/portable/qbrain --report evidence/recall-process.json | tee evidence/recall-process.log
          python3 .ci/test_multiterm_process.py --binary build/portable/qbrain --report evidence/multiterm-process.json | tee evidence/multiterm-process.log
          python3 .ci/test_conflict_unit.py --binary build/portable/qbrain_conflict_tests --report evidence/conflict-unit.json | tee evidence/conflict-unit.log
          python3 .ci/test_conflict_process.py --binary build/portable/qbrain --report evidence/conflict-process.json | tee evidence/conflict-process.log
          build/portable/qbrain_cjk_tests | tee evidence/cjk-unit.log
          python3 .ci/test_cjk_recall.py --binary build/portable/qbrain --report evidence/cjk-recall.json | tee evidence/cjk-recall.log
          build/portable/qbrain_embedding_tests | tee evidence/embedding-unit.log
          python3 .ci/test_embedding_search.py --binary build/portable/qbrain | tee evidence/embedding-search.log
          build/portable/qbrain_http_tests | tee evidence/http-input.log
          build/portable/qbrain_memory_tests | tee evidence/memory-unit.log
          build/portable/qbrain_context_tests | tee evidence/context-unit.log
          python3 .ci/test_local_config.py --binary build/portable/qbrain | tee evidence/local-config.log
          python3 .ci/test_memory_cycle.py --binary build/portable/qbrain | tee evidence/memory.log
          python3 .ci/test_mcp_boundaries.py --binary build/portable/qbrain | tee evidence/mcp.log
          python3 .ci/test_hooks.py --binary build/portable/qbrain | tee evidence/hooks.log
          python3 .ci/test_context_process.py --binary build/portable/qbrain --report evidence/benchmark.json | tee evidence/context.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qbrain-n44-portable-logs
          path: evidence/
          retention-days: 14
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Full native application build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-cl.ps1 2>&1 | Tee-Object evidence/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native bounded WinHTTP production transport fixtures
        shell: pwsh
        run: |
          cmake -S . -B build/http -DQBRAIN_WITH_PG=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/http --config Release --target qbrain_http_tests qbrain_http_probe qbrain_retrieval_tests qbrain_embedding_tests qbrain_embedding_queue_tests qbrain_cjk_tests qbrain_fact_tests qbrain_conflict_tests qbrain_recall_tests qbrain_hook_fact_tests qbrain_promotion_tests qbrain_lifecycle_tests qbrain_lifecycle_batch_tests qbrain_lifecycle_candidate_tests qbrain_strict_json_tests qbrain_hook_trace_tests qbrain_hook_diagnostic_tests qbrain_multiterm_tests --parallel 2 2>&1 | Tee-Object evidence/http-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/http/Release/qbrain_http_tests.exe 2>&1 | Tee-Object evidence/http-input.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S tests/http_lifecycle -B build/http-lifecycle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/http-lifecycle --config Release --parallel 2 2>&1 | Tee-Object evidence/lifecycle-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .ci/test_http_lifecycle.py --probe build/http-lifecycle/Release/qbrain_http_lifecycle_current.exe --baseline build/http-lifecycle/Release/qbrain_http_lifecycle_legacy.exe --per-call build/http-lifecycle/Release/qbrain_http_lifecycle_per_call.exe --report evidence/http-lifecycle.json 2>&1 | Tee-Object evidence/http-lifecycle.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .ci/test_http_transport.py --probe build/http/Release/qbrain_http_probe.exe --report evidence/http-transport.json 2>&1 | Tee-Object evidence/http-transport.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exact retrieval differential checks and synthetic baseline benchmark
        shell: pwsh
        run: |
          python .ci/test_retrieval_benchmark.py --binary build/http/Release/qbrain_retrieval_tests.exe --report evidence/retrieval-benchmark.json --require-windows 2>&1 | Tee-Object evidence/retrieval.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Embedding contracts and production model isolation
        shell: pwsh
        run: |
          python .ci/test_embedding_queue.py --binary build/http/Release/qbrain_embedding_queue_tests.exe --report evidence/embedding-queue.json --require-windows 2>&1 | Tee-Object evidence/embedding-queue.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/http/Release/qbrain_embedding_tests.exe 2>&1 | Tee-Object evidence/embedding-unit.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .ci/test_embedding_transport.py --probe build/http/Release/qbrain_http_probe.exe --report evidence/embedding-transport.json 2>&1 | Tee-Object evidence/embedding-transport.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .ci/test_embedding_search.py --binary build/cl/qbrain.exe 2>&1 | Tee-Object evidence/embedding-search.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: CJK literal page recall and memory endpoint regression
        shell: pwsh
        run: |
          & build/http/Release/qbrain_cjk_tests.exe 2>&1 | Tee-Object evidence/cjk-unit.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .ci/test_cjk_recall.py --binary build/cl/qbrain.exe --report evidence/cjk-recall.json 2>&1 | Tee-Object evidence/cjk-recall.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Evidence-backed fact lifecycle and source/write boundaries
        shell: pwsh
        run: |
          python .ci/test_fact_unit.py --binary build/http/Release/qbrain_fact_tests.exe --report evidence/fact-unit.json --require-windows 2>&1 | Tee-Object evidence/fact-unit.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .ci/test_fact_process.py --binary build/cl/qbrain.exe --report evidence/fact-process.json 2>&1 | Tee-Object evidence/fact-process.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Atomic lifecycle batch and read-only preview
        shell: pwsh
        run: |
          python .ci/test_strict_json_unit.py --binary build/http/Release/qbrain_strict_json_tests.exe --report evidence/strict-json-unit.json --require-windows 2>&1 | Tee-Object evidence/strict-json-unit.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .ci/test_hook_trace_unit.py --binary build/http/Release/qbrain_hook_trace_tests.exe --report evidence/hook-trace-unit.json --require-windows 2>&1 | Tee-Object evidence/hook-trace-unit.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .ci/test_hook_diagnostic_unit.py --binary build/http/Release/qbrain_hook_diagnostic_tests.exe --report evidence/hook-diagnostic-unit.json --require-windows 2>&1 | Tee-Object evidence/hook-diagnostic-unit.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .ci/test_lifecycle_candidate_unit.py --binary build/http/Release/qbrain_lifecycle_candidate_tests.exe --report evidence/candidate-unit.json --require-windows 2>&1 | Tee-Object evidence/candidate-unit.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .ci/test_lifecycle_batch_unit.py --binary build/http/Release/qbrain_lifecycle_batch_tests.exe --report evidence/batch-unit.json --require-windows 2>&1 | Tee-Object evidence/batch-unit.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .ci/test_strict_json_process.py --binary build/cl/qbrain.exe --report evidence/strict-json-process.json 2>&1 | Tee-Object evidence/strict-json-process.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .ci/test_hook_trace_process.py --binary build/cl/qbrain.exe --report evidence/hook-trace-process.json 2>&1 | Tee-Object evidence/hook-trace-process.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .ci/test_hook_diagnostic_process.py --binary build/cl/qbrain.exe --report evidence/hook-diagnostic-process.json 2>&1 | Tee-Object evidence/hook-diagnostic-process.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .ci/test_lifecycle_candidate_process.py --binary build/cl/qbrain.exe --report evidence/candidate-process.json 2>&1 | Tee-Object evidence/candidate-process.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .ci/test_lifecycle_batch_process.py --binary build/cl/qbrain.exe --report evidence/batch-process.json 2>&1 | Tee-Object evidence/batch-process.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Reversible fact archival and advisory lifecycle inspection
        shell: pwsh
        run: |
          python .ci/test_lifecycle_unit.py --binary build/http/Release/qbrain_lifecycle_tests.exe --report evidence/fact-lifecycle-unit.json --require-windows 2>&1 | Tee-Object evidence/fact-lifecycle-unit.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .ci/test_lifecycle_process.py --binary build/cl/qbrain.exe --report evidence/fact-lifecycle-process.json 2>&1 | Tee-Object evidence/fact-lifecycle-process.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Opt-in local event-to-fact promotion and installer consent
        shell: pwsh
        run: |
          python .ci/test_promotion_unit.py --binary build/http/Release/qbrain_promotion_tests.exe --report evidence/promotion-unit.json --require-windows 2>&1 | Tee-Object evidence/promotion-unit.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .ci/test_promotion_process.py --binary build/cl/qbrain.exe --report evidence/promotion-process.json 2>&1 | Tee-Object evidence/promotion-process.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File .ci/test_promotion_install.ps1 -Binary build/cl/qbrain.exe -Report evidence/promotion-install51.json 2>&1 | Tee-Object evidence/promotion-install51.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File .ci/test_promotion_install.ps1 -Binary build/cl/qbrain.exe -Report evidence/promotion-install7.json 2>&1 | Tee-Object evidence/promotion-install7.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Opt-in Hook fact recall and unified context budget
        shell: pwsh
        run: |
          python .ci/test_hook_fact_unit.py --binary build/http/Release/qbrain_hook_fact_tests.exe --report evidence/hook-fact-unit.json --require-windows 2>&1 | Tee-Object evidence/hook-fact-unit.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .ci/test_hook_fact_process.py --binary build/cl/qbrain.exe --report evidence/hook-fact-process.json 2>&1 | Tee-Object evidence/hook-fact-process.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File .ci/test_hook_fact_install.ps1 -Binary build/cl/qbrain.exe -Report evidence/hook-fact-install51.json 2>&1 | Tee-Object evidence/hook-fact-install51.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File .ci/test_hook_fact_install.ps1 -Binary build/cl/qbrain.exe -Report evidence/hook-fact-install7.json 2>&1 | Tee-Object evidence/hook-fact-install7.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Query-directed recall with complete counter-evidence
        shell: pwsh
        run: |
          python .ci/test_recall_unit.py --binary build/http/Release/qbrain_recall_tests.exe --report evidence/recall-unit.json --require-windows 2>&1 | Tee-Object evidence/recall-unit.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .ci/test_multiterm_unit.py --binary build/http/Release/qbrain_multiterm_tests.exe --report evidence/multiterm-unit.json --require-windows 2>&1 | Tee-Object evidence/multiterm-unit.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .ci/test_recall_process.py --binary build/cl/qbrain.exe --report evidence/recall-process.json 2>&1 | Tee-Object evidence/recall-process.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .ci/test_multiterm_process.py --binary build/cl/qbrain.exe --report evidence/multiterm-process.json 2>&1 | Tee-Object evidence/multiterm-process.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Paired conflict inspection and source boundaries
        shell: pwsh
        run: |
          python .ci/test_conflict_unit.py --binary build/http/Release/qbrain_conflict_tests.exe --report evidence/conflict-unit.json --require-windows 2>&1 | Tee-Object evidence/conflict-unit.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .ci/test_conflict_process.py --binary build/cl/qbrain.exe --report evidence/conflict-process.json 2>&1 | Tee-Object evidence/conflict-process.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real memory MCP hooks context and local-config process tests
        shell: pwsh
        run: |
          foreach ($suite in @('memory_cycle','mcp_boundaries','hooks','context_process','local_config')) {
            python .ci/test_$suite.py --binary build/cl/qbrain.exe 2>&1 | Tee-Object evidence/$suite.log
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python .ci/test_context_process.py --binary build/cl/qbrain.exe --report evidence/benchmark.json 2>&1 | Tee-Object evidence/benchmark.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: PowerShell 5.1 transport and reversible installation
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .ci/test_windows_transport.ps1 -Binary build/cl/qbrain.exe 2>&1 | Tee-Object evidence/transport51.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File .ci/test_install_hooks.ps1 -Binary build/cl/qbrain.exe 2>&1 | Tee-Object evidence/install51.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: PowerShell 7 transport and reversible installation
        shell: pwsh
        run: |
          pwsh -NoProfile -File .ci/test_windows_transport.ps1 -Binary build/cl/qbrain.exe 2>&1 | Tee-Object evidence/transport7.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File .ci/test_install_hooks.ps1 -Binary build/cl/qbrain.exe 2>&1 | Tee-Object evidence/install7.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Full original regression plus context unit group
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-tests-cl.ps1 -SkipProductionBuild 2>&1 | Tee-Object evidence/regression.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify all gates and package exact tested binary
        shell: pwsh
        run: |
          python .ci/package_n44_development.py 2>&1 | Tee-Object evidence/package-gate.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qbrain-n44-windows-logs
          path: evidence/
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: qbrain-n44-windows-development-package
          path: package/
          retention-days: 14
  windows-http-2022:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build and validate the same HTTP source on Server 2022
        shell: pwsh
        run: |
          New-Item -ItemType Directory evidence | Out-Null
          git rev-parse HEAD | Set-Content evidence/source.txt
          [Environment]::OSVersion.VersionString | Set-Content evidence/platform.txt
          cmake -S . -B build/http -DQBRAIN_WITH_PG=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
