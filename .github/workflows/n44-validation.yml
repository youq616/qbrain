          path: evidence/
          retention-days: 14
  batch-sanitized:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Instrumented production batch and prior read-only recall
        shell: bash
        env:
          CC: clang
          CXX: clang++
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          mkdir evidence
          git rev-parse HEAD > evidence/source.txt
          clang --version > evidence/compiler.txt
          cmake -S . -B build/sanitized -G Ninja -DQBRAIN_WITH_PG=OFF -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined' 2>&1 | tee evidence/configure.log
          cmake --build build/sanitized --target qbrain qbrain_lifecycle_batch_tests qbrain_recall_tests qbrain_lifecycle_candidate_tests qbrain_strict_json_tests qbrain_hook_trace_tests qbrain_hook_diagnostic_tests qbrain_multiterm_tests --parallel 2 2>&1 | tee evidence/build.log
          python -B .ci/test_strict_json_unit.py --binary build/sanitized/qbrain_strict_json_tests --report evidence/strict-json-unit.json 2>&1 | tee evidence/strict-json-unit.log
          python -B .ci/test_hook_trace_unit.py --binary build/sanitized/qbrain_hook_trace_tests --report evidence/hook-trace-unit.json 2>&1 | tee evidence/hook-trace-unit.log
          python -B .ci/test_hook_diagnostic_unit.py --binary build/sanitized/qbrain_hook_diagnostic_tests --report evidence/hook-diagnostic-unit.json 2>&1 | tee evidence/hook-diagnostic-unit.log
          python -B .ci/test_multiterm_unit.py --binary build/sanitized/qbrain_multiterm_tests --report evidence/multiterm-unit.json 2>&1 | tee evidence/multiterm-unit.log
          python -B .ci/test_lifecycle_candidate_unit.py --binary build/sanitized/qbrain_lifecycle_candidate_tests --report evidence/candidate-unit.json 2>&1 | tee evidence/candidate-unit.log
          python -B .ci/test_lifecycle_batch_unit.py --binary build/sanitized/qbrain_lifecycle_batch_tests --report evidence/batch-unit.json 2>&1 | tee evidence/batch-unit.log
          build/sanitized/qbrain_recall_tests 2>&1 | tee evidence/prior-recall.log
          python -B .ci/test_strict_json_process.py --binary build/sanitized/qbrain --report evidence/strict-json-process.json 2>&1 | tee evidence/strict-json-process.log
          python -B .ci/test_hook_trace_process.py --binary build/sanitized/qbrain --report evidence/hook-trace-process.json 2>&1 | tee evidence/hook-trace-process.log
          python -B .ci/test_hook_diagnostic_process.py --binary build/sanitized/qbrain --report evidence/hook-diagnostic-process.json 2>&1 | tee evidence/hook-diagnostic-process.log
          python -B .ci/test_multiterm_process.py --binary build/sanitized/qbrain --report evidence/multiterm-process.json 2>&1 | tee evidence/multiterm-process.log
          python -B .ci/test_lifecycle_candidate_process.py --binary build/sanitized/qbrain --report evidence/candidate-process.json 2>&1 | tee evidence/candidate-process.log
          python -B .ci/test_lifecycle_batch_process.py --binary build/sanitized/qbrain --report evidence/batch-process.json 2>&1 | tee evidence/batch-process.log
          python -B .ci/test_lifecycle_candidate_report.py 2>&1 | tee evidence/candidate-report-tests.log
          python -B .ci/test_lifecycle_batch_report.py 2>&1 | tee evidence/batch-report-tests.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qbrain-n47g-sanitizer-evidence
          path: evidence/
          retention-days: 14
  publish-cjk-preview:
    needs: [source, portable, windows, windows-http-2022, batch-sanitized]
    if: github.repository == 'youq616/qbrain' && github.ref == 'refs/heads/optimization/n46f-cjk-recall' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify same-run package, upload draft, read back, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B tools/delivery/publish_cjk_preview.py
  publish-fact-preview:
    needs: [source, portable, windows, windows-http-2022, batch-sanitized]
    # Owner requires an actual independent subagent review before stage publication.
    # A successful CI run alone is not a review. Keep candidate artifacts only.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify same-source fact preview before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B tools/delivery/publish_fact_preview.py
