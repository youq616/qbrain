name: Hook context evidence helper
on:
  push:
    branches: ['validation/n47d-live-intake', 'main']
    paths: ['tools/acceptance/inspect_hook_context.py', 'tests/test_hook_context_evidence.py', '.github/workflows/hook-context-evidence.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-helper:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Exact state, privacy and failure tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest discover -s tests -p test_hook_context_evidence.py -v
