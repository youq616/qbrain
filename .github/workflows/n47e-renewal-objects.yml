name: Fixed N47E renewal source objects
on:
  push:
    branches: ['delivery/n47e-renewal-objects']
    paths: ['.github/workflows/n47e-renewal-objects.yml']
permissions:
  contents: read
jobs:
  transfer:
    if: github.repository == 'youq616/qbrain' && github.ref == 'refs/heads/delivery/n47e-renewal-objects'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 95c5b6741754a70f7484ff4c7011f61656face5b
          path: candidate
          persist-credentials: false
      - name: Validate fixed base, patch and every old/new blob
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64,hashlib,json,lzma,os,subprocess
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'n47e-source-objects';root.mkdir()
          def git(*args):
              return subprocess.check_output(['git','-C','candidate',*args],timeout=30).decode().strip()
          encoded=Path('transport/transfer/n47e-renewal.b64').read_text(encoding='ascii').strip()
          assert len(encoded)==9528
          packed=base64.b64decode(encoded,validate=True)
          assert len(packed)==7144 and hashlib.sha256(packed).hexdigest()=='9ef82ff3a85f5712185ccc9f35c647404ddeeb8c98d1ac25b0d613b272cf9fc9'
          decoder=lzma.LZMADecompressor(memlimit=128*1024*1024)
          raw=decoder.decompress(packed,max_length=128*1024)
          assert decoder.eof and not decoder.unused_data and len(raw)==21805
          document=json.loads(raw.decode('utf-8'))
          assert document['base']==git('rev-parse','HEAD')=='95c5b6741754a70f7484ff4c7011f61656face5b'
          assert git('rev-parse','HEAD^{tree}')=='0ae9ed3b088fe267b142981ce8f1183a0fe1fa62'
          expected={'.ci/test_promotion_process.py','.ci/test_promotion_report.py','.ci/validate_promotion_report.py','docs/integration/LOCAL-FACT-PROMOTION.zh-CN.md','src/qbrain/memory/fact_store.cpp','tests/test_n47e.cpp'}
          entries=document['files'];assert len(entries)==6 and {e['path'] for e in entries}==expected
          for e in entries:assert git('rev-parse','HEAD:'+e['path'])==e['old_sha']
          patch=root/'change.diff';patch.write_text(document['patch'],encoding='utf-8',newline='')
          assert hashlib.sha256(patch.read_bytes()).hexdigest()=='51c9c6814df086695dc8502098c984bd5c3e163f77eb998c29c49381564c149a'
          subprocess.run(['git','-C','candidate','apply','--index',str(patch)],check=True,timeout=30)
          assert set(git('diff','--cached','--name-only').splitlines())==expected
          assert git('write-tree')=='07f00ef07fc1cb79642472b63052221c84bb2db1'
          result=[]
          for e in entries:
              data=Path('candidate',e['path']).read_bytes()
              digest=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert digest==e['sha']==git('rev-parse',':'+e['path'])
              request=root/'request.json';request.write_text(json.dumps({'content':data.decode('utf-8'),'encoding':'utf-8'}),encoding='utf-8')
              response=json.loads(subprocess.check_output(['gh','api','--method','POST','repos/youq616/qbrain/git/blobs','--input',str(request)],timeout=60))
              assert response['sha']==digest
              result.append({'path':e['path'],'mode':'100644','type':'blob','sha':digest})
          evidence=Path('evidence');evidence.mkdir()
          report={'result':'SOURCE_OBJECTS_UPLOADED','base':document['base'],'tree':git('write-tree'),'files':result,'product_ref_changed':False,'product_execution':False}
          (evidence/'source-objects.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n47e-renewal-source-objects
          path: evidence/source-objects.json
          retention-days: 14
